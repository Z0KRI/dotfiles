# ~/.config/wireplumber/wireplumber.conf.d/51-bluez-ofono.conf
#
# Que el manos libres lo lleve oFono y no el backend nativo de PipeWire. Los
# dos implementan el mismo perfil y se pelean por él; BlueFerry controla la
# llamada a través de oFono, así que oFono tiene que ser el dueño del canal.
#
# NO añadas `bluez5.roles` aquí: BlueFerry escribe su propio fragmento
# (99-blueferry-keep-phone-audio.conf, en esta misma carpeta) que deja la
# música en el iPhone y, con las llamadas encendidas, conserva los roles de
# manos libres. Si pones roles aquí, se pisan.

monitor.bluez.properties = {
  bluez5.hfphsp-backend = "ofono"
}
